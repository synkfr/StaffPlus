name: Staff
version: 1.2.3
main: me.ayosynk.staff.bukkit.StaffBukkitPlugin
api-version: '1.20'
folia-supported: true
description: Advanced modern moderation and utility plugin with Folia support.
authors: [me.ayosynk, Antigravity]

permissions:
  staff.admin:
    description: Gives all staff permissions.
    default: op
    children:
      staff.mute: true
      staff.tempmute: true
      staff.ban: true
      staff.tempban: true
      staff.ipban: true
      staff.tempipban: true
      staff.unmute: true
      staff.unban: true
      staff.unipban: true
      staff.warn: true
      staff.warns: true
      staff.invsee: true
      staff.vanish: true
      staff.vanish.see: true
      staff.monitor: true
      staff.fly: true
      staff.gmc: true
      staff.gms: true
      staff.gmsp: true
      staff.gma: true
      staff.import: true
      staff.staff: true
      staff.bans: true
      staff.bansleaderboard: true
      staff.kick: true
      staff.unwarn: true
      staff.checkban: true
      staff.staff.reload: true
      staff.update.notify: true
  staff.mute:
    description: Mute a player.
    default: op
  staff.tempmute:
    description: Temporarily mute a player.
    default: op
  staff.ban:
    description: Ban a player.
    default: op
  staff.tempban:
    description: Temporarily ban a player.
    default: op
  staff.ipban:
    description: IP-ban a player.
    default: op
  staff.tempipban:
    description: Temporarily IP-ban a player.
    default: op
  staff.unmute:
    description: Unmute a player.
    default: op
  staff.unban:
    description: Unban a player.
    default: op
  staff.unipban:
    description: Unban an IP address.
    default: op
  staff.warn:
    description: Warn a player.
    default: op
  staff.warns:
    description: View or clear warnings.
    default: op
  staff.invsee:
    description: Inspect a player's inventory live.
    default: op
  staff.vanish:
    description: Toggle vanish mode.
    default: op
  staff.vanish.see:
    description: See vanished staff members.
    default: op
  staff.monitor:
    description: Spectate and follow a player.
    default: op
  staff.fly:
    description: Toggle player flight mode.
    default: op
  staff.gmc:
    description: Switch to creative mode.
    default: op
  staff.gms:
    description: Switch to survival mode.
    default: op
  staff.gmsp:
    description: Switch to spectator mode.
    default: op
  staff.gma:
    description: Switch to adventure mode.
    default: op
  staff.import:
    description: Import punishments from other plugins.
    default: op
  staff.staff:
    description: Access staff utility subcommands.
    default: op
  staff.bans:
    description: View recent bans and ban history.
    default: op
  staff.bansleaderboard:
    description: View staff ban leaderboard.
    default: op
  staff.kick:
    description: Kick an online player.
    default: op
  staff.unwarn:
    description: Remove a warning from a player.
    default: op
  staff.checkban:
    description: Check active ban status.
    default: op
  staff.staff.reload:
    description: Reload Staff+ configurations.
    default: op
  staff.update.notify:
    description: Receive notifications when updates are available.
    default: op
